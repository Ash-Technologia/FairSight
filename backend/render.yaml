services:
  - type: web
    name: fairsight-backend
    env: python
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOW_ALL_ORIGINS
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"
